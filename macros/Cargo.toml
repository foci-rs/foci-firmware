[package]
name = "foci-firmware-macros"
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Proc-macros for foci-firmware: host-side test fixtures and CommissionReplySink manifest codegen"
repository = "https://github.com/foci-rs/foci-firmware"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
