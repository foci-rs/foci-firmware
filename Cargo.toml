[package]
name = "foci-firmware"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Board-agnostic FOCI firmware library: protocol handlers, commissioning, trace capture, and platform traits"
repository = "https://github.com/foci-rs/foci-firmware"

[features]
dev = []
trace = []
trace-velocity-limit-latch-test = ["trace"]

[dependencies]
ankyra = { git = "https://github.com/foci-rs/ankyra" }
ankyra-macros = { git = "https://github.com/foci-rs/ankyra" }
cortex-m = "0.7"
defmt = "1.0"
embassy-sync = "0.6"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
foci-klipper = { git = "https://github.com/foci-rs/foci-klipper" }
foci-tmc4671 = { git = "https://github.com/foci-rs/foci-tmc4671" }
heapless = { version = "0.9", features = ["defmt"] }
libm = "0.2"
static_assertions = "1.1"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
defmt = { version = "1.0", features = ["unstable-test"] }
embedded-hal-mock = { version = "0.11", features = ["eh1", "embedded-hal-async"] }
foci-firmware-macros = { path = "macros" }
pollster = "0.4"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
